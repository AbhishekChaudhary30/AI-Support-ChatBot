[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-chatbot"
version = "0.2.0"
description = "A portfolio-grade AI Customer Support Chatbot powered by Chainlit, LangChain, and Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AI Engineering Team" }
]
keywords = [
    "customer-support",
    "chatbot",
    "rag",
    "langchain",
    "chainlit",
    "ollama",
    "llm"
]
dependencies = [
    "chainlit>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Isolated fast unit tests (no external services or network)",
    "integration: Tests requiring external services or local daemons (e.g., Ollama)"
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
